services:
  - type: web
    name: tikdown
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 240
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DOWNLOAD_TIMEOUT
        value: "180"
      - key: MAX_DOWNLOAD_MB
        value: "150"
